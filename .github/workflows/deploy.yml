name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Firebase web config is public (shipped in the client bundle) — safe to inline.
          VITE_FIREBASE_API_KEY: AIzaSyA9BP-5ItWJRkNdZEkfJ0aLKVP4NMNi9c4
          VITE_FIREBASE_AUTH_DOMAIN: prompt-59bcb.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: prompt-59bcb
          VITE_FIREBASE_STORAGE_BUCKET: prompt-59bcb.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "741642074790"
          VITE_FIREBASE_APP_ID: "1:741642074790:web:78d040e84ee940f03d1267"
          VITE_FIREBASE_MEASUREMENT_ID: G-HEF0XSYLV4
          VITE_ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS || 'qa@muhayu.com' }}
          # Set WORKER_BASE to the deployed Worker URL to enable prompt execution.
          VITE_WORKER_BASE: ${{ vars.WORKER_BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
